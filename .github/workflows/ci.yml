name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mariadb@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - "127.0.0.1:33384:3306"
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pci-test-only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      BIBI_TEST_DB_HOST: 127.0.0.1
      BIBI_TEST_DB_PORT: "33384"
      BIBI_TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            ops/package-lock.json
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run check
        env:
          BIBI_TEST_DB_CONTAINER: ${{ job.services.mysql.id }}
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            .superpowers/e2e/auth/*.png
            .superpowers/e2e/access-logs/*.png
            .superpowers/e2e/admin-usability/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}
          path: |
            .releases/*.tgz
            .releases/*.tgz.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
