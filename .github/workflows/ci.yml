name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mariadb@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - "127.0.0.1:33384:3306"
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pci-test-only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      BIBI_TEST_DB_HOST: 127.0.0.1
      BIBI_TEST_DB_PORT: "33384"
      BIBI_TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0 # Compile the pinned pre-profile backend for rollback verification.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            ops/package-lock.json
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: docker pull php:8.4-cli@sha256:d63e8b80cd4c6cfd01cfa7c910522e299cdc7ca1a2b6d6563db48df3c17e6c55
      - run: npm run check
        env:
          BIBI_TEST_DB_CONTAINER: ${{ job.services.mysql.id }}
      - run: npm run build
      - run: node scripts/visitor-context-bundle-check.mjs
      - run: node scripts/content-bundle-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            .superpowers/e2e/auth/*.png
            .superpowers/e2e/access-logs/*.png
            .superpowers/e2e/admin-usability/*.png
            .superpowers/e2e/profile/*.png
            .superpowers/e2e/visitor-analytics/*.png
            .superpowers/e2e/visitor-relay/*.png
            .superpowers/e2e/visitor-context-bundle/*.png
            .superpowers/e2e/content-source/*
            .superpowers/e2e/content-compiled/**/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}
          path: |
            .releases/*.tgz
            .releases/*.tgz.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
